<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Paper Reading Workflow ZH 架构示意图</title>
  <desc id="desc">三段式图示：可选论文发现入口、单篇论文证据处理、专题归档与综述维护。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#546070" />
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f8b5d" />
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .panel-blue { fill: #eef5ff; stroke: #bfd2f5; stroke-width: 1.4; }
      .panel-green { fill: #effaf4; stroke: #bde7cd; stroke-width: 1.4; }
      .panel-gray { fill: #f5f7fb; stroke: #d5dde9; stroke-width: 1.4; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .card-blue { fill: #ffffff; stroke: #7fa5ff; stroke-width: 2; }
      .card-green { fill: #ffffff; stroke: #7bc792; stroke-width: 2; }
      .subtitle { font: 500 15px Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif; fill: #647083; }
      .panel-title { font: 800 14px Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; fill: #496ca8; }
      .panel-title-green { font: 800 14px Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; fill: #357750; }
      .label { font: 700 18px Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif; fill: #1d2738; }
      .small { font: 500 12px Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif; fill: #667085; }
      .tiny { font: 500 11px Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif; fill: #738095; }
      .arrow { fill: none; stroke: #546070; stroke-width: 2.4; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #3f8b5d; stroke-width: 2.4; marker-end: url(#green-arrow); }
      .dash { fill: none; stroke: #3f8b5d; stroke-width: 2.2; stroke-dasharray: 8 8; marker-end: url(#green-arrow); }
      .dot { fill: #eef3ff; stroke: #adc4fb; stroke-width: 1.2; }
      .dot-green { fill: #ecf8f1; stroke: #acdcbc; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="680" rx="30" />

  <text x="56" y="56" font-family="Inter, PingFang SC, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#172033">Paper Reading Workflow ZH</text>
  <text x="56" y="84" class="subtitle">可选发现入口、单篇证据笔记、专题语料综述，分层而不是一条硬流水线。</text>

  <rect x="54" y="120" width="245" height="300" rx="22" class="panel-gray" />
  <text x="78" y="153" class="panel-title">输入入口</text>

  <rect x="88" y="184" width="176" height="58" rx="14" class="card" />
  <circle cx="114" cy="213" r="15" class="dot" />
  <text x="114" y="219" text-anchor="middle" class="label">1</text>
  <text x="176" y="207" text-anchor="middle" class="label">标题 / URL</text>
  <text x="176" y="229" text-anchor="middle" class="small">或截图文字</text>

  <rect x="88" y="274" width="176" height="58" rx="14" class="card" />
  <circle cx="114" cy="303" r="15" class="dot" />
  <text x="114" y="309" text-anchor="middle" class="label">2</text>
  <text x="176" y="297" text-anchor="middle" class="label">OpenCLI</text>
  <text x="176" y="319" text-anchor="middle" class="small">可选论文发现</text>

  <rect x="88" y="350" width="176" height="44" rx="14" class="card" />
  <text x="176" y="377" text-anchor="middle" class="label">本地 PDF</text>

  <rect x="334" y="120" width="812" height="300" rx="22" class="panel-blue" />
  <text x="358" y="153" class="panel-title">单篇证据笔记</text>

  <rect x="370" y="205" width="150" height="78" rx="16" class="card" />
  <circle cx="398" cy="236" r="15" class="dot" />
  <path d="M392 231h12v11h-12z" fill="none" stroke="#5575b6" stroke-width="2" />
  <text x="445" y="234" text-anchor="middle" class="label">PDF Inbox</text>
  <text x="445" y="258" text-anchor="middle" class="small">源文件 PDF</text>

  <rect x="562" y="205" width="150" height="78" rx="16" class="card-blue" />
  <circle cx="590" cy="236" r="15" class="dot" />
  <path d="M584 241l6-13 6 13" fill="none" stroke="#5575b6" stroke-width="2" stroke-linecap="round" />
  <text x="637" y="234" text-anchor="middle" class="label">Datalab</text>
  <text x="637" y="258" text-anchor="middle" class="small">Markdown / JSON</text>

  <rect x="754" y="185" width="168" height="118" rx="16" class="card-blue" />
  <circle cx="784" cy="226" r="15" class="dot" />
  <path d="M778 226h12M784 220v12" stroke="#5575b6" stroke-width="2" />
  <text x="838" y="218" text-anchor="middle" class="label">证据工作区</text>
  <text x="838" y="242" text-anchor="middle" class="small">全文 + 图表</text>
  <text x="838" y="262" text-anchor="middle" class="small">清单 + 报告</text>

  <rect x="966" y="185" width="142" height="118" rx="16" class="card" />
  <circle cx="994" cy="226" r="15" class="dot" />
  <path d="M988 222h12v10h-12z" fill="none" stroke="#5575b6" stroke-width="2" />
  <text x="1037" y="218" text-anchor="middle" class="label">正式笔记</text>
  <text x="1037" y="242" text-anchor="middle" class="small">15 节结构</text>
  <text x="1037" y="262" text-anchor="middle" class="small">英文笔记</text>

  <rect x="966" y="330" width="142" height="50" rx="14" class="card" />
  <text x="1037" y="351" text-anchor="middle" class="label">阅读索引</text>
  <text x="1037" y="371" text-anchor="middle" class="small">reading-index</text>

  <path class="arrow" d="M264 303 C300 303 320 244 360 244" />
  <path class="arrow" d="M264 372 H320 C342 372 342 244 360 244" />
  <path class="arrow" d="M520 244 H552" />
  <path class="arrow" d="M712 244 H744" />
  <path class="arrow" d="M922 244 H956" />
  <path class="arrow" d="M1037 303 V320" />

  <rect x="54" y="466" width="1092" height="160" rx="22" class="panel-green" />
  <text x="78" y="499" class="panel-title-green">专题语料层</text>

  <rect x="176" y="524" width="180" height="70" rx="16" class="card-green" />
  <circle cx="205" cy="559" r="15" class="dot-green" />
  <path d="M199 559h12" stroke="#43875d" stroke-width="2" />
  <text x="266" y="565" text-anchor="middle" class="label">专题归档</text>

  <rect x="446" y="524" width="180" height="70" rx="16" class="card-green" />
  <circle cx="475" cy="559" r="15" class="dot-green" />
  <path d="M469 554h12v10h-12z" fill="none" stroke="#43875d" stroke-width="2" />
  <text x="536" y="551" text-anchor="middle" class="label">索引</text>
  <text x="536" y="579" text-anchor="middle" class="small">+ inventory</text>

  <rect x="716" y="524" width="180" height="70" rx="16" class="card-green" />
  <circle cx="745" cy="559" r="15" class="dot-green" />
  <path d="M739 564l6-13 6 13" fill="none" stroke="#43875d" stroke-width="2" stroke-linecap="round" />
  <text x="806" y="551" text-anchor="middle" class="label">三类综述</text>
  <text x="806" y="579" text-anchor="middle" class="small">全景 / 学术 / 工程</text>

  <rect x="964" y="524" width="132" height="70" rx="16" class="card-green" />
  <text x="1030" y="551" text-anchor="middle" class="label">维护</text>
  <text x="1030" y="579" text-anchor="middle" class="small">扫描 + 刷新</text>

  <path class="arrow-green" d="M1037 380 C1037 448 266 448 266 514" />
  <path class="arrow-green" d="M356 559 H436" />
  <path class="arrow-green" d="M626 559 H706" />
  <path class="arrow-green" d="M896 559 H954" />
  <path class="dash" d="M1030 524 C1030 486 830 486 806 514" />

  <text x="90" y="648" class="tiny">OpenCLI 是可选发现入口；证据制品和正式笔记分离保存，直到进入专题归档阶段再合流。</text>
</svg>
