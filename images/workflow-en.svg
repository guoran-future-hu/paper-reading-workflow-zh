<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Paper Reading Workflow ZH pipeline</title>
  <desc id="desc">A local-first paper workflow from paper discovery to PDF inbox, MinerU extraction, evidence workspace, Obsidian note, topic archive, surveys, and recurring maintenance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472" />
    </marker>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#162033" flood-opacity="0.10" />
    </filter>
    <style>
      .bg { fill: #f7f9fc; }
      .band { fill: #edf3ff; stroke: #cbdaf7; stroke-width: 1.2; }
      .band2 { fill: #eefaf3; stroke: #c5e8d3; stroke-width: 1.2; }
      .node { fill: #ffffff; stroke: #c9d3e3; stroke-width: 1.4; filter: url(#soft-shadow); }
      .node-strong { fill: #ffffff; stroke: #82a7ff; stroke-width: 1.8; filter: url(#soft-shadow); }
      .node-green { fill: #ffffff; stroke: #83c99d; stroke-width: 1.8; filter: url(#soft-shadow); }
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6472; }
      .label { font: 700 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d2738; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #697386; }
      .band-label { font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; fill: #4f6fa8; }
      .band-label2 { font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; fill: #3f835b; }
      .arrow { stroke: #5b6472; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #3f835b; stroke-width: 2.4; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 8; }
      .icon { fill: #eef3ff; stroke: #b9caf4; stroke-width: 1; }
      .icon-green { fill: #ecf8f0; stroke: #b9e2c8; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="560" rx="28" />

  <text x="60" y="58" class="title">Paper Reading Workflow ZH</text>
  <text x="60" y="86" class="subtitle">Single-paper evidence, clean notes, and topic-level survey maintenance in one local-first loop.</text>

  <rect x="52" y="122" width="1096" height="205" rx="22" class="band" />
  <text x="78" y="153" class="band-label">SINGLE PAPER LAYER</text>

  <rect x="92" y="188" width="140" height="88" rx="14" class="node" />
  <circle cx="122" cy="218" r="15" class="icon" />
  <path d="M116 218h12M122 212v12" stroke="#5270ad" stroke-width="2" />
  <text x="162" y="218" text-anchor="middle" class="label">Paper</text>
  <text x="162" y="242" text-anchor="middle" class="small">title / URL / PDF</text>

  <rect x="280" y="188" width="140" height="88" rx="14" class="node" />
  <circle cx="310" cy="218" r="15" class="icon" />
  <path d="M304 218h12M310 212v12" stroke="#5270ad" stroke-width="2" />
  <text x="350" y="218" text-anchor="middle" class="label">OpenCLI</text>
  <text x="350" y="242" text-anchor="middle" class="small">source discovery</text>

  <rect x="468" y="188" width="140" height="88" rx="14" class="node" />
  <circle cx="498" cy="218" r="15" class="icon" />
  <path d="M492 213h12v10h-12z" fill="none" stroke="#5270ad" stroke-width="2" />
  <text x="538" y="218" text-anchor="middle" class="label">PDF Inbox</text>
  <text x="538" y="242" text-anchor="middle" class="small">read markers</text>

  <rect x="656" y="188" width="140" height="88" rx="14" class="node-strong" />
  <circle cx="686" cy="218" r="15" class="icon" />
  <path d="M680 222l6-12 6 12" fill="none" stroke="#5270ad" stroke-width="2" stroke-linecap="round" />
  <text x="726" y="218" text-anchor="middle" class="label">MinerU</text>
  <text x="726" y="242" text-anchor="middle" class="small">Markdown / JSON</text>

  <rect x="844" y="188" width="140" height="88" rx="14" class="node-strong" />
  <circle cx="874" cy="218" r="15" class="icon" />
  <path d="M868 218h12M874 212v12" stroke="#5270ad" stroke-width="2" />
  <text x="914" y="218" text-anchor="middle" class="label">Evidence</text>
  <text x="914" y="242" text-anchor="middle" class="small">figures + reports</text>

  <rect x="1002" y="188" width="106" height="88" rx="14" class="node" />
  <circle cx="1032" cy="218" r="15" class="icon" />
  <path d="M1026 214h12v10h-12z" fill="none" stroke="#5270ad" stroke-width="2" />
  <text x="1055" y="217" text-anchor="middle" class="label">Note</text>
  <text x="1055" y="242" text-anchor="middle" class="small">14 sections</text>

  <path class="arrow" d="M232 232 H270" />
  <path class="arrow" d="M420 232 H458" />
  <path class="arrow" d="M608 232 H646" />
  <path class="arrow" d="M796 232 H834" />
  <path class="arrow" d="M984 232 H992" />

  <rect x="52" y="365" width="1096" height="142" rx="22" class="band2" />
  <text x="78" y="396" class="band-label2">TOPIC CORPUS LAYER</text>

  <rect x="188" y="422" width="190" height="58" rx="14" class="node-green" />
  <circle cx="218" cy="451" r="14" class="icon-green" />
  <path d="M211 451h14" stroke="#4a8b62" stroke-width="2" />
  <text x="283" y="456" text-anchor="middle" class="label">Topic Archive</text>

  <rect x="506" y="422" width="190" height="58" rx="14" class="node-green" />
  <circle cx="536" cy="451" r="14" class="icon-green" />
  <path d="M530 446h12v10h-12z" fill="none" stroke="#4a8b62" stroke-width="2" />
  <text x="601" y="456" text-anchor="middle" class="label">Inventory</text>

  <rect x="824" y="422" width="190" height="58" rx="14" class="node-green" />
  <circle cx="854" cy="451" r="14" class="icon-green" />
  <path d="M848 456l6-12 6 12" fill="none" stroke="#4a8b62" stroke-width="2" stroke-linecap="round" />
  <text x="919" y="446" text-anchor="middle" class="label">Surveys</text>
  <text x="919" y="467" text-anchor="middle" class="small">overview / academic / engineering</text>

  <path class="arrow" d="M1055 276 C1055 338 283 338 283 412" />
  <path class="arrow" d="M378 451 H496" />
  <path class="arrow" d="M696 451 H814" />
  <path class="loop" d="M919 422 C918 354 1084 354 1084 420 C1084 500 940 512 926 486" />

  <text x="1008" y="377" class="small">recurring maintenance</text>
</svg>
