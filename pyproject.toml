[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reading-workflow-zh"
version = "0.2.0"
description = "A Chinese evidence-grounded paper reading workflow for PDFs, MinerU, and Obsidian notes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Zhongyue Lin" }]
dependencies = []

[project.optional-dependencies]
visual = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
paper-notes-download = "paper_notes.download:main"
paper-notes-extract = "paper_notes.mineru_extract:main"
paper-notes-figures = "paper_notes.figure_manifest:main"
paper-notes-validate = "paper_notes.validate_notes:main"

[tool.setuptools]
packages = ["paper_notes"]

[tool.ruff]
line-length = 120
target-version = "py310"
